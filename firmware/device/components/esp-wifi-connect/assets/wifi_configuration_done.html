<!doctype html>
<!-- OpenCharm's Wi-Fi setup, done (spec 009): says so, then asks the charm to close its hotspot
     and join the network (POST /exit, as the upstream page does). DESIGN.md, no web fonts. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCharm · Connected</title>
    <style>
      :root {
        --bg: #f6f6f4;
        --card: #ffffff;
        --ink: #0a0a0a;
        --ink2: #3a3a3a;
        --mute: #6e6e6e;
        --sans:
          Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--bg);
        background-image:
          linear-gradient(rgba(10, 10, 10, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(10, 10, 10, 0.07) 1px, transparent 1px),
          linear-gradient(rgba(10, 10, 10, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(10, 10, 10, 0.03) 1px, transparent 1px);
        background-size:
          160px 160px,
          160px 160px,
          20px 20px,
          20px 20px;
        color: var(--ink);
        font: 400 15px/1.55 var(--sans);
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }
      .card {
        width: 100%;
        max-width: 480px;
        background: var(--card);
        border: 1.5px solid var(--ink);
        padding: 28px 20px;
        text-align: center;
      }
      .face {
        width: 120px;
        height: 120px;
        margin: 0 auto 20px;
        border-radius: 31%;
        background: #000;
        color: #f4f3ee;
        display: grid;
        place-items: center;
        font: 800 34px/1 var(--mono);
      }
      .label {
        color: var(--mute);
        font: 400 12px/1.5 var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin: 0 0 8px;
      }
      h1 {
        margin: 0 0 10px;
        font: 600 22px/1.2 var(--sans);
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 10px;
        color: var(--ink2);
      }
      .note {
        color: var(--mute);
        font: 400 11px/1.7 var(--mono);
        letter-spacing: 0.06em;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="face" aria-hidden="true">^ ^</div>
      <p class="label">OpenCharm · Wi-Fi</p>
      <h1 id="title">Connected</h1>
      <p id="line">Your charm is joining your Wi-Fi now.</p>
      <p>
        Its screen shows a 6-digit code once it finds charmd: type it in the
        OpenCharm app.
      </p>
      <p class="note">
        This hotspot closes now. Your phone goes back to its usual Wi-Fi.
      </p>
    </main>
    <script>
      "use strict";
      const ssid = new URLSearchParams(location.search).get("ssid");
      if (ssid)
        document.getElementById("line").textContent =
          "Your charm is joining " + ssid + " now.";
      setTimeout(() => {
        fetch("/exit", { method: "POST" }).catch(() => {});
      }, 1500);
    </script>
  </body>
</html>
