dependencies:
  idf: ">=6.1"
  # The same screen and touch drivers XiaoZhi v2.5.2 uses for this board.
  espressif/esp_lcd_co5300: "^2.1.0"
  waveshare/esp_lcd_touch_cst9217: "^1.0.3"
  # Wi-Fi setup (hotspot and page) as XiaoZhi v2.5.2 uses it, and Espressif's WebSocket client.
  78/esp-wifi-connect: "~3.3.1"
  espressif/esp_websocket_client: "^1.8.0"
  # Finding charmd on the local network when no address was typed (spec 009).
  espressif/mdns: "^1.8.0"
  # Audio as XiaoZhi v2.5.2 has it: the ES8311/ES7210 codecs, Opus, and echo cancellation (esp-sr).
  espressif/esp_codec_dev: "~1.6.2"
  espressif/esp_audio_codec: "~2.5.0"
  espressif/esp-sr: "==2.4.7"
