<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenCharm</title>
    <link rel="stylesheet" href="sim.css" />
    <style>
      /* Only the panel is drawn: everything around it is the desktop showing through. */
      html,
      body,
      main,
      .stage {
        background: transparent !important;
        background-image: none !important;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      /* Never the emulator's device frame: the charm shows only once it's shaped for the notch. */
      .charm:not(.notch) {
        visibility: hidden !important;
      }
      /* The emulator page's pieces the desktop charm doesn't show. */
      header,
      aside,
      .key {
        display: none !important;
      }
      main,
      .stage {
        margin: 0 !important;
        padding: 0 !important;
        display: block !important;
      }
      /* Rounded like the charm: soft corners hugging the menu bar when compact, a deep squircle-like
         curve when the panel opens below the notch. */
      .charm.notch {
        margin: 0 !important;
        box-shadow: none !important;
        border-radius: 0 0 calc(var(--strip) * 0.5) calc(var(--strip) * 0.5) !important;
        transition:
          height 0.28s cubic-bezier(0.2, 0.9, 0.25, 1.1),
          border-radius 0.28s ease !important;
      }
      /* --panel-radius comes from the core (sim.js), which draws the orange outline with it. */
      .charm.notch.open {
        border-radius: 0 0 var(--panel-radius) var(--panel-radius) !important;
      }
      .charm.notch::before {
        display: none; /* the real notch is right there */
      }
      /* The typing field (spec 013): a pill in the open panel, in the charm's own type. */
      .type-field {
        position: fixed;
        left: 18px;
        right: 18px;
        height: 34px;
        padding: 0 14px;
        box-sizing: border-box;
        border: 1px solid #3a3a3a;
        border-radius: 999px;
        background: #111;
        color: #f6f6f4;
        font: 500 14px/1 var(--mono);
        outline: none;
        caret-color: #f6f6f4;
        -webkit-user-select: text;
        user-select: text;
      }
      .type-field::placeholder {
        color: #777;
      }
      .type-field:focus {
        border-color: #6a6a6a;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <span id="status"></span>
        <span id="url"></span>
      </header>
      <section class="stage">
        <div class="charm" id="charm">
          <canvas id="screen" aria-label="OpenCharm"></canvas>
          <button class="key" id="key" aria-hidden="true"></button>
        </div>
        <aside>
          <button id="wifi"></button>
          <button id="shape"></button>
          <button id="forget"></button>
        </aside>
      </section>
    </main>
    <script type="module" src="desktop.js"></script>
  </body>
</html>
