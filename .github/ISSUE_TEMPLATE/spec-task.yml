name: Spec task
description: One task from an approved spec, ready for a person or a coding agent.
title: "[NNN] "
labels: ["spec-task"]
body:
  - type: input
    id: spec
    attributes:
      label: Spec
      description: Path to the approved spec, e.g. specs/002-charmd-core/spec.md
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What to build, in one or two sentences. Point at the plan task if there is one (e.g. plan.md Task 3).
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The acceptance items this task proves, copied from the spec.
      value: |
        - [ ] `npm run check` passes
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes for the agent
      description: Files to read first, constraints, anything not obvious from the spec.
