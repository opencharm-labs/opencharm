name: Bug
description: Something doesn't work as OPENCHARM.md says it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps, what you expected, what you saw. Include OS, Node version and the command.
    validations:
      required: true
  - type: textarea
    id: builds
    attributes:
      label: What you were running
      description: >
        Paste the output of `opencharm status` (it names charmd, each connected charm and the starter
        your workspace began from). The desktop app shows its identity at the bottom of Settings; the
        website, in its title block (REV) or at opencharm.dev/version.json.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      render: text
