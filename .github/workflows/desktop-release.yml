name: Desktop release
# Builds the desktop charm for macOS (Apple silicon and Intel) and Windows and attaches the installers
# to its GitHub release, so people can install it without building it. Started by release.yml on the
# desktop@<version> tag that release-please created (or by hand on that tag: Actions → Desktop
# release → Run workflow → choose the tag). The builds are unsigned for now (apps/desktop/README.md).
# Builds from scratch on purpose: no caches, so what we publish never depends on an earlier run.
on:
  workflow_dispatch:
concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$TAG" != "desktop@$VERSION" ]; then
            echo "Run this on the tag desktop@$VERSION, not $TAG"
            exit 1
          fi
          ID=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId -q .databaseId)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
  emulator:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
      - run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          npm run firmware:sim
      - uses: actions/upload-artifact@v7
        with:
          name: charm-sim
          path: packages/cli/sim
          if-no-files-found: error
  build:
    needs: [release, emulator]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: charm-sim
          path: packages/cli/sim
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Uploads to the release release-please created; its name and notes (the changelog) stay as they are.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}
          releaseId: ${{ needs.release.outputs.id }}
  # Unsigned builds earn trust another way: checksums to compare, and a signed statement from GitHub
  # that these files were built by this workflow from this commit
  # (gh attestation verify <file> --repo <owner>/<repo>).
  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets --pattern '*.dmg' --pattern '*.exe' --pattern '*.msi'
          cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: assets/*
      # The release notes are the changelog; the install notes go under them, once.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          if ! grep -q "Install and first-run notes" <<<"$NOTES"; then
            README="https://github.com/$GITHUB_REPOSITORY/blob/main/apps/desktop/README.md"
            {
              echo "$NOTES"
              echo
              echo "---"
              echo
              echo "The desktop charm: OpenCharm under your Mac's notch (Windows: a pill at the top of the screen)."
              echo "Install and first-run notes: $README"
              echo "Unsigned for now: compare SHA256SUMS.txt, or run gh attestation verify <file> --repo $GITHUB_REPOSITORY."
              echo "Provided as is, with no warranty."
            } > notes.md
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          fi
