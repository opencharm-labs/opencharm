name: Desktop release
# main is production: after every push to main whose CI passed, this decides whether the desktop app
# has something to release (tools/release: conventional-commit titles since the last desktop@ tag, in
# the folders the app ships). If so, it builds macOS (Apple silicon and Intel) and Windows with the
# version stamped in; `publish` then checksums and attests the installers, attaches them to a fresh
# draft release and publishes it, which creates the desktop@<version> tag (CONTRIBUTING "Releasing").
# A failed run publishes nothing; re-run it, or start it by hand on main (Actions → Desktop release →
# Run workflow). The builds are unsigned for now (apps/desktop/README.md). Built from scratch on
# purpose: no build caches, so what we publish never depends on an earlier run (npm downloads come
# from the setup action's cache, checked against the lockfile's integrity hashes).
# Security: the jobs that run third-party code (npm ci, emsdk, cargo and Tauri builds) have a read-only
# token; only `publish`, which runs no installed code, can write releases and sign attestations.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
# Real releases run one at a time, in order (a newer one waiting replaces an older one waiting: it
# covers the same commits and more). Runs that release nothing get a group of their own, so they never
# displace a waiting release.
# The release condition appears here and in the first job's `if` (GitHub allows no variables in either):
# keep the two identical.
concurrency:
  group: ${{ github.workflow }}-${{ ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) && 'release' || github.run_id }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
jobs:
  plan:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: plan
        uses: ./.github/actions/release-plan
        with:
          unit: desktop
          notes: ${{ runner.temp }}/notes/notes.md
      - if: steps.plan.outputs.version != ''
        uses: actions/upload-artifact@v7
        with:
          name: desktop-notes
          path: ${{ runner.temp }}/notes
          if-no-files-found: error
  emulator:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
      - run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          npm run firmware:sim
      - uses: actions/upload-artifact@v7
        with:
          name: charm-sim
          path: packages/cli/sim
          if-no-files-found: error
  build:
    needs: [plan, emulator]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: charm-sim
          path: packages/cli/sim
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The repository says 0.0.0; the release build carries its real version. Tauri's
      # beforeBuildCommand assembles the web files (the emulator above, the desktop page).
      - shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          npm pkg set version="$VERSION" -w apps/desktop
          npm run bundle -w apps/desktop -- --target "$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
  # Unsigned builds earn trust another way: checksums to compare, and a signed statement from GitHub
  # that these files were built by this workflow from this commit
  # (gh attestation verify <file> --repo <owner>/<repo>).
  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: desktop-notes
          path: ${{ runner.temp }}/notes
      - run: |
          cd "$RUNNER_TEMP/assets"
          ls -la
          sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/assets/*
      # Skipped if already released. Otherwise a fresh draft (earlier drafts from failed runs of this
      # workflow are removed), filled with every file, then published: publishing creates the tag, so a
      # desktop@ tag always means a complete release.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released"
            exit 0
          fi
          # Only drafts this workflow made (marked below); a draft someone writes by hand is left alone.
          MARK="<!-- desktop-release.yml -->"
          DRAFTS=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            -q ".[] | select(.draft and (.body // \"\" | contains(\"$MARK\"))) | .id")
          for id in $DRAFTS; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            echo "Deleted earlier draft $id"
          done
          README="https://github.com/$GITHUB_REPOSITORY/blob/main/apps/desktop/README.md"
          {
            echo
            echo "---"
            echo
            echo "The desktop charm: OpenCharm under your Mac's notch (Windows: a pill at the top of the screen)."
            echo "Install and first-run notes: $README"
            echo "Unsigned for now: compare SHA256SUMS.txt, or run gh attestation verify <file> --repo $GITHUB_REPOSITORY."
            echo "Provided as is, with no warranty."
            echo
            echo "$MARK"
          } >> "$RUNNER_TEMP/notes/notes.md"
          ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$SHA" \
            -f name="desktop: $VERSION" -F draft=true -F prerelease=true -F body=@"$RUNNER_TEMP/notes/notes.md" -q .id)
          for file in "$RUNNER_TEMP"/assets/*; do
            name=$(basename "$file")
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=$name" >/dev/null
            echo "Attached $name"
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false >/dev/null
          echo "Published $TAG"
