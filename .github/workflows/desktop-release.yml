name: Desktop release
# main is production: after every push to main whose CI passed, this decides whether the desktop app
# has something to release (tools/release: conventional-commit titles since the last desktop@ tag, in
# the folders the app ships). If so, it builds macOS (Apple silicon and Intel) and Windows with the
# version stamped in, attaches the installers, checksums and build attestations to a draft release,
# and publishes it, which creates the desktop@<version> tag (CONTRIBUTING "Releasing"). A failed run
# leaves only a draft; re-running it (or Actions → Desktop release → Run workflow) picks it up again.
# The builds are unsigned for now (apps/desktop/README.md). Built from scratch on purpose: no caches,
# so what we publish never depends on an earlier run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
# One release at a time, in order: the next run starts from the tag this one creates.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: write
env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: plan
        run: npx tsx tools/release/scripts/next-release.ts desktop --head "$SHA" --notes "$RUNNER_TEMP/notes.md"
      # The draft holds the installers until they're all there; a re-run reuses it.
      - id: draft
        if: steps.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            -q ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -z "$ID" ]; then
            README="https://github.com/$GITHUB_REPOSITORY/blob/main/apps/desktop/README.md"
            {
              echo
              echo "---"
              echo
              echo "The desktop charm: OpenCharm under your Mac's notch (Windows: a pill at the top of the screen)."
              echo "Install and first-run notes: $README"
              echo "Unsigned for now: compare SHA256SUMS.txt, or run gh attestation verify <file> --repo $GITHUB_REPOSITORY."
              echo "Provided as is, with no warranty."
            } >> "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --draft --prerelease \
              --title "desktop: $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
            ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              -q ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n 1)
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
  emulator:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: ./.github/actions/setup
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
      - run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          npm run firmware:sim
      - uses: actions/upload-artifact@v7
        with:
          name: charm-sim
          path: packages/cli/sim
          if-no-files-found: error
  build:
    needs: [plan, emulator]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: charm-sim
          path: packages/cli/sim
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The repository says 0.0.0; the release build carries its real version.
      - shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: npm pkg set version="$VERSION" -w apps/desktop
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}
          releaseId: ${{ needs.plan.outputs.release }}
  # Unsigned builds earn trust another way: checksums to compare, and a signed statement from GitHub
  # that these files were built by this workflow from this commit
  # (gh attestation verify <file> --repo <owner>/<repo>).
  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.plan.outputs.release }}
        run: |
          mkdir assets
          for url in $(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --paginate \
            -q '.[] | select(.name | test("\\.(dmg|exe|msi)$")) | .url'); do
            name=$(gh api "$url" -q .name)
            gh api -H "Accept: application/octet-stream" "$url" > "assets/$name"
          done
          cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: assets/*
      # Publishing the draft creates the tag: a desktop@ tag always means a complete release.
      - env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.plan.outputs.release }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          OLD=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --paginate -q '.[] | select(.name == "SHA256SUMS.txt") | .id')
          if [ -n "$OLD" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD"; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=SHA256SUMS.txt" \
            --hostname uploads.github.com -H "Content-Type: text/plain" --input assets/SHA256SUMS.txt >/dev/null
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f tag_name="$TAG" >/dev/null
          echo "Published $TAG"
