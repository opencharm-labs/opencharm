name: CLI release
# main is production: after every push to main whose CI passed, this decides whether the CLI has
# something to release (tools/release: conventional-commit titles since the last cli@ tag, in the
# folders the CLI ships). If so, it stamps the version, builds the emulator and the CLI, runs the
# CLI's tests, publishes `opencharm` to npm with provenance, then tags cli@<version> and creates the
# GitHub release with the notes (CONTRIBUTING "Releasing"). Every step skips what's already done, so
# a failed run can be re-run, or started again by hand (Actions → CLI release → Run workflow).
# Auth: npm trusted publishing only (OIDC, set up on npmjs.com for this workflow; the package refuses
# tokens), so there is no npm secret in this repository.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
# One release at a time, in order: the next run starts from the tag this one creates.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: plan
        run: npx tsx tools/release/scripts/next-release.ts cli --head "$SHA" --notes "$RUNNER_TEMP/notes.md"
      - if: steps.plan.outputs.version != ''
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - if: steps.plan.outputs.version != ''
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
      # The repository says 0.0.0; the release build carries its real version.
      - if: steps.plan.outputs.version != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          npm pkg set version="$VERSION" -w packages/cli
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          npm run firmware:sim
          npm run build -w packages/cli
          npm test -w packages/cli
      # Trusted publishing needs npm 11.5.1 or later; fail clearly instead of falling back to a token.
      - if: steps.plan.outputs.version != ''
        run: |
          NPM=$(npm --version)
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$NPM" \
            || { echo "npm $NPM is too old for trusted publishing (needs 11.5.1+)"; exit 1; }
      # --provenance makes a publish without provenance fail, never slip through.
      - if: steps.plan.outputs.version != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if npm view "opencharm@$VERSION" version >/dev/null 2>&1; then
            echo "opencharm@$VERSION is already on npm"
          else
            npm publish -w packages/cli --provenance --access public
          fi
      # Tagged once the package is out, so a tag always means a published version.
      - if: steps.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          echo "Install or update: npm i -g opencharm (Node 24). Published from CI with npm provenance." >> "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "cli: $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest
