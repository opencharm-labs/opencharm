name: CLI release
# Publishes `opencharm` to npm with provenance (npm shows which commit and workflow built it): builds
# the emulator and the CLI and runs the CLI's tests first. Started by release.yml on the cli@<version>
# tag that release-please created (or by hand on that tag: Actions → CLI release → Run workflow →
# choose the tag); a version already on npm is skipped, so a re-run is safe. Auth: npm trusted
# publishing only (OIDC, set up on npmjs.com for this workflow; the package refuses tokens), so there
# is no npm secret in this repository.
on:
  workflow_dispatch:
concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "$TAG" != "cli@$VERSION" ]; then
            echo "Run this on the tag cli@$VERSION, not $TAG"
            exit 1
          fi
          if npm view "opencharm@$VERSION" version >/dev/null 2>&1; then
            echo "opencharm@$VERSION is already on npm"
          else
            echo "publish=$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish != ''
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - if: steps.version.outputs.publish != ''
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
      - if: steps.version.outputs.publish != ''
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          npm run firmware:sim
          npm run build -w packages/cli
          npm test -w packages/cli
      # Trusted publishing needs npm 11.5.1 or later; fail clearly instead of falling back to a token.
      - if: steps.version.outputs.publish != ''
        run: |
          NPM=$(npm --version)
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$NPM" \
            || { echo "npm $NPM is too old for trusted publishing (needs 11.5.1+)"; exit 1; }
      # --provenance makes a publish without provenance fail, never slip through.
      - if: steps.version.outputs.publish != ''
        run: npm publish -w packages/cli --provenance --access public
