name: CLI release
# Run by hand on main (Actions → CLI release → Run workflow): if packages/cli's version isn't on npm
# yet, build the emulator and the CLI and publish `opencharm` to npm with provenance (npm shows which
# commit and workflow built it). Auth: npm trusted publishing for this workflow (set up once on
# npmjs.com), or an NPM_TOKEN secret for the very first publish.
# Manual only while the repository is private. At launch, release on every version bump again by
# adding `push: branches: [main]` under `on:` (the version check already skips published versions).
on:
  workflow_dispatch:
concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - id: version
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if npm view "opencharm@$VERSION" version >/dev/null 2>&1; then
            echo "opencharm@$VERSION is already on npm"
          else
            echo "publish=$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish != ''
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - if: steps.version.outputs.publish != ''
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
      - if: steps.version.outputs.publish != ''
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          npm run firmware:sim
          npm run build -w packages/cli
          npm test -w packages/cli
      - if: steps.version.outputs.publish != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - if: steps.version.outputs.publish != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish -w packages/cli --provenance --access public
