name: Build
on:
  pull_request:
  push:
    branches: [main, develop]
# A superseded push should not keep a runner busy; the newest commit wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build
      # The bundle must run on its own: catches dependencies that break when inlined.
      - run: node packages/cli/dist/main.mjs faces --no-color
