name: Audit
# Known vulnerabilities in what we ship (production dependencies, high or worse). Weekly as well:
# new advisories appear without any change here.
on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: "17 6 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm audit --omit=dev --audit-level=high
