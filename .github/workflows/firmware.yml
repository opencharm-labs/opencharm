name: Firmware
on:
  pull_request:
  push:
    branches: [main, develop]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The core's tests read packages/protocol/fixtures and firmware/core/src/generated/faces.h, both in the repo.
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      # Same clang-format major as contributors (brew install clang-format); older versions format differently.
      - run: pip install "clang-format==23.1.*"
      - run: npm run firmware:format:check
      - run: cmake -S firmware/core -B firmware/core/build -G Ninja
      - run: cmake --build firmware/core/build
      - run: ctest --test-dir firmware/core/build --output-on-failure
